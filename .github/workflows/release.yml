name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version commits, tags, and GitHub releases
  pull-requests: write # create the "Version Packages" PR
  id-token: write # OIDC token for npm trusted publishing

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing requires npm CLI >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        # @v2 is required to work with @changesets/cli v3.
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # create-github-releases and push-git-tags both default to true.
        env:
          # No NPM_TOKEN: npm authenticates via OIDC (trusted publishing).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
