name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  e2e:
    name: E2E (real node-av encode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E encode tests
        run: npm run test:e2e

  # Version & publish runs AFTER test and e2e succeed on main pushes, so a
  # failing e2e (or any other check) blocks the release instead of publishing
  # broken output.
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # version commits, tags, and GitHub releases
      pull-requests: write # create the "Version Packages" PR
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing requires npm CLI >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        # @v2 is required to work with @changesets/cli v3.
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # No NPM_TOKEN: npm authenticates via OIDC (trusted publishing).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
