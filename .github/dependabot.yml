version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      lint-and-format:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "eslint-config-prettier"
      test-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
      tooling:
        patterns:
          - "tsup"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
          - "@changesets/*"
          - "@types/node"
    ignore:
      # Major versions are reviewed manually.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
